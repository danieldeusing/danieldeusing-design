name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, matching release.yml. NOT cosmetic: the DOM suites talk to Chrome over a
          # WebSocket, and `WebSocket` only became a Node global in 22 — on 20 they die with
          # `ReferenceError: WebSocket is not defined`. Nobody could discover that while the
          # suites were skipping for want of a browser, which is finding #1 in one sentence.
          node-version: 22

      # The package has no dependencies, so there is nothing to install.
      - name: Build dist + tokens
        run: node scripts/build.mjs

      # The table pager's arithmetic. node:test, no dependency, no DOM — see the header
      # of the script for what it covers and what it deliberately leaves to
      # bin/cockpit-render-check in danieldeusing-infra.
      - name: Check pagination
        run: node scripts/check-pagination.mjs

      # The table component's MEMORY: a stored view is untrusted input and it names columns, which
      # get renamed. Drives a real headless chromium because the subject is localStorage, live
      # .value properties and a MutationObserver — it SKIPS loudly where no browser exists rather
      # than going red for its own reasons.
      - name: Check table tools
        env:
          DD_REQUIRE_BROWSER: "1"
        run: node scripts/check-tabletools.mjs

      # The scroll wrapper reaching tables that did not exist when it was called. Same harness and
      # the same skip. Never wired into CI when it was written, so it had been running nowhere.
      - name: Check table scroll
        env:
          DD_REQUIRE_BROWSER: "1"
        run: node scripts/check-tablescroll.mjs

      # A tooltipped control must still RECEIVE ITS CLICKS. show() used to park the panel at the
      # viewport origin to measure it, which dropped it under the cursor and cost every tipped
      # control its clicks — mousedown and mouseup resolved to an ancestor, so no click was ever
      # generated. Cockpit shipped both its join buttons with the tooltip REMOVED as a workaround.
      - name: Check tooltip clicks
        env:
          DD_REQUIRE_BROWSER: "1"
        run: node scripts/check-tooltip-click.mjs

      # The dist bundle and tokens.json are committed (jsDelivr serves them). Fail
      # if a source change landed without rebuilding the committed artifacts.
      - name: Check the README teaches the current release
        run: node scripts/check-readme-pins.mjs

      - name: Check the release gate still gates
        run: node scripts/check-release-gate.mjs

      - name: Verify committed artifacts are up to date
        run: |
          if ! git diff --exit-code dist tokens/tokens.json; then
            echo "::error::dist/ or tokens/tokens.json is out of date — run 'npm run build' and commit the result."
            exit 1
          fi
